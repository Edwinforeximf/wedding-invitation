<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wedding Admin</title><link rel="stylesheet" href="/style.css"></head><body><section id="login" class="section"><div class="eyebrow">Wedding Dashboard</div><h1 style="font-size:3rem">Admin Login</h1><form id="loginForm"><input id="password" type="password" placeholder="Password admin" required><button>Masuk Dashboard</button></form></section><div id="app" class="admin hidden"><aside class="sidebar"><h2>Wedding Admin</h2><button data-tab="overview" class="active">Ringkasan</button><button data-tab="guests">Daftar Tamu</button><button data-tab="editor">Edit Undangan</button><button data-tab="wishes">Ucapan</button><a href="/" class="button outline" style="display:block;margin-top:15px">Lihat Undangan</a><button id="logout">Keluar</button></aside><main class="main"><section id="overview" class="tab"><h2>Dashboard</h2><div id="stats" class="stats"></div><div class="panel"><h3>Ringkasan RSVP</h3><p id="summary"></p></div></section><section id="guests" class="tab hidden"><h2>Daftar Tamu</h2><form id="guestForm"><input id="newName" placeholder="Nama tamu" required><input id="newCategory" placeholder="Kategori (mis. VIP)"><button>Tambah Tamu</button></form><button id="export">Ekspor CSV</button><div class="panel"><table><thead><tr><th>Nama</th><th>Kategori</th><th>RSVP</th><th>Jumlah</th><th>Link</th><th>Aksi</th></tr></thead><tbody id="guestRows"></tbody></table></div></section><section id="editor" class="tab hidden"><h2>Edit Undangan</h2><div class="panel"><form id="settingsForm" class="formgrid" style="max-width:none"></form></div></section><section id="wishes" class="tab hidden"><h2>Ucapan & Doa</h2><div id="wishRows" class="panel"></div></section></main></div><script src="/admin.js"></script></body></html>
